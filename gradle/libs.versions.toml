[versions]
# Project
project-version = "1.15"
config-version = "2"
commands-config-version = "2"
features-config-version = "1"
lang-version = "4"

# Build
run-task = "3.0.2"
paperweight = "2.0.0-beta.21"

# Platform
paper-api = "1.21.11-R0.1-SNAPSHOT"
datafixerupper = "8.0.16"
jetbrains-annotations = "26.0.2"

# Dependency Loader
asm = "9.9.1"
asmcommons = "9.9.1"
jar-relocator = "1.7"

# Common
caffeine = "3.2.3"

# Command
geantyref = "2.0.1"
mojang-brigadier = "1.3.10"
cloud-core = "2.0.0"
cloud-services = "2.0.0"
cloud-brigadier = "2.0.0-beta.15"
cloud-bukkit = "2.0.0-beta.15"
cloud-paper = "2.0.0-beta.15"
cloud-minecraft-extras = "2.0.0-beta.15"

# Sparrow
sparrow-nbt = "0.22"
sparrow-reflection = "0.34"
sparrow-yaml = "1.0.22"
sparrow-ui = "beta.36"

# Adventure
adventure = "5.2.0"
option = "1.1.0"
examination-api = "1.3.0"

# Storage
mongodb-driver = "5.7.0"
jdbi = "3.54.0"
hikari-cp = "7.1.0"
mysql-driver = "9.7.0"
mariadb-driver = "3.5.10"
postgresql-driver = "42.7.13"
checker-qual = "3.55.1"
reactive-streams = "1.0.4"
lettuce = "7.7.0.RELEASE"
jackson-core = "3.1.4"
jackson-annotations = "2.22"
jackson-datatype = "2.22.0"
netty = "4.1.132.Final"
reactor = "3.8.5"

# Test
junit = "6.0.1"
mockbukkit = "4.93.0"

[plugins]
# Build
shadow = { id = "com.gradleup.shadow", version = "9.3.2" }
paper-weight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
plugin-yml = { id = "de.eldoria.plugin-yml.paper", version = "0.9.0" }
bukkit-plugin-yml = { id = "de.eldoria.plugin-yml.bukkit", version = "0.9.0" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.0.9" }

[libraries]
# Platform
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
datafixerupper = { module = "com.mojang:datafixerupper", version.ref = "datafixerupper" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# Dependency Loader
asm-core = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asmcommons" }

# Storage
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
hikari-cp = { module = "com.zaxxer:HikariCP", version.ref = "hikari-cp" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-driver" }
mariadb-driver = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-driver" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql-driver" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-qual" }

# Command
mojang-brigadier = { module = "com.mojang:brigadier", version.ref = "mojang-brigadier" }
geantyref = { module = "io.leangen.geantyref:geantyref", version.ref = "geantyref" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud-core" }
cloud-services = { module = "org.incendo:cloud-services", version.ref = "cloud-services" }
cloud-brigadier = { module = "org.incendo:cloud-brigadier", version.ref = "cloud-brigadier" }
cloud-bukkit = { module = "org.incendo:cloud-bukkit", version.ref = "cloud-bukkit" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-minecraft-extras" }

# Sparrow
sparrow-nbt = { module = "net.momirealms:sparrow-nbt", version.ref = "sparrow-nbt" }
sparrow-nbt-adventure = { module = "net.momirealms:sparrow-nbt-adventure", version.ref = "sparrow-nbt" }
sparrow-nbt-codec = { module = "net.momirealms:sparrow-nbt-codec", version.ref = "sparrow-nbt" }
sparrow-nbt-legacy-codec = { module = "net.momirealms:sparrow-nbt-legacy-codec", version.ref = "sparrow-nbt" }
sparrow-reflection = { module = "net.momirealms:sparrow-reflection", version.ref = "sparrow-reflection" }
sparrow-yaml = { module = "net.momirealms:sparrow-yaml", version.ref = "sparrow-yaml" }
sparrow-ui = { module = "net.momirealms:sparrow-ui", version.ref = "sparrow-ui" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-commons = { module = "net.kyori:adventure-text-serializer-commons", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-json-legacy-impl = { module = "net.kyori:adventure-text-serializer-json-legacy-impl", version.ref = "adventure" }
adventure-text-serializer-json = { module = "net.kyori:adventure-text-serializer-json", version.ref = "adventure" }
option = { module = "net.kyori:option", version.ref = "option" }
examination-api = { module = "net.kyori:examination-api", version.ref = "examination-api" }
examination-string = { module = "net.kyori:examination-string", version.ref = "examination-api" }

# Test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
test-paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

[bundles]
# ASM
asm = [
    "asm-core",
    "asm-commons"
]

# Adventure
adventure = [
    "adventure-api",
    "adventure-nbt",
    "adventure-key",
    "adventure-text-minimessage",
    "adventure-text-serializer-commons",
    "adventure-text-serializer-legacy",
    "adventure-text-serializer-plain",
    "adventure-text-serializer-gson",
    "adventure-text-serializer-json-legacy-impl",
    "adventure-text-serializer-json",
]

# Sparrow NBT
sparrow-nbt = [
    "sparrow-nbt",
    "sparrow-nbt-adventure",
    "sparrow-nbt-codec",
    "sparrow-nbt-legacy-codec"
]
